<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#135d9e"><title>Pièces de rechange</title><style>*{box-sizing:border-box}body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f3f5f7;color:#17202a}header{background:#135d9e;color:#fff;padding:18px 14px;position:sticky;top:0;z-index:2}h1{margin:0 0 4px;font-size:24px}main{max-width:900px;margin:auto;padding:12px}.card,.result{background:#fff;border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 2px 7px #0001}input,button{font:inherit;padding:12px;border-radius:8px}#q{width:100%;border:1px solid #aab4bd;font-size:18px}button{border:0;background:#135d9e;color:#fff;margin:8px 4px 0 0;cursor:pointer}.danger{background:#a52828}.muted{color:#66727c;font-size:14px}.result{border-left:5px solid #135d9e;cursor:pointer}.ref{font-size:18px;font-weight:700}.loc{color:#b33b00;font-size:22px;font-weight:700;margin-top:5px}.detail{display:none}.detail.show{display:block}.row{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid #e5e8eb;padding:7px 0}.row b{color:#43515c}.row span{text-align:right;overflow-wrap:anywhere}.ok,.error,.info{margin-top:12px;padding:12px;border-radius:8px}.ok{background:#e6f6ea;color:#176b31}.error{background:#feecec;color:#9b2020}.info{background:#e8f2fc;color:#164d7d}</style></head><body><header><h1>Pièces de rechange</h1><div>Recherche locale hors connexion</div></header><main><div class="card"><input id="q" type="text" placeholder="Référence, désignation, emplacement, meuble…" autocomplete="off"><div id="count" class="muted"></div></div><div class="card"><b>Mise à jour de la liste</b><p class="muted">Téléchargez la dernière liste depuis GitHub ou choisissez un CSV exporté depuis Access.</p><button id="downloadGithub">Télécharger la dernière version depuis GitHub</button><br><input id="file" type="file" accept=".csv,text/csv"><div id="status"></div><div id="importok"></div><button id="export">Exporter une sauvegarde locale</button><button id="clear" class="danger">Effacer la base locale</button></div><section id="results"></section><div id="detail" class="card detail"></div></main><script>
const GITHUB_CSV_URL="https://raw.githubusercontent.com/Didierdu11/GMAO/main/T_piece_de_rechange.csv";
const KEY="pieces-rechange-v7";const REQUIRED=["Référence","Emplacement"];const FIELDS=["N° pièce","CodeSAP","Désignation","Référence","Fabriquant","Référence fabricant","IDFamille","Fournisseur","Prix","Stock","Stock sécurité","Stock MAXI","Coût reconditionnement","Emplacement","Notes","Pièce à réparer","Delai de reappro","photos","Remis en état","lien plan meca","Criticité","Pieces SAP","Masqué","Statut_piece","Statut_Date","Meuble","Tiroir","Position","Supprime","Date_supp","Nom_Supp"];let data=[],meta=null;try{data=JSON.parse(localStorage.getItem(KEY)||"[]");meta=JSON.parse(localStorage.getItem(KEY+"-meta")||"null")}catch(e){console.warn("Stockage local indisponible",e)}const $=s=>document.querySelector(s),q=$("#q"),results=$("#results"),count=$("#count"),detail=$("#detail"),status=$("#status"),importOk=$("#importok");function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}function normalize(v){return String(v??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[\s._-]+/g,"")}function showMessage(type,text){status.className=type;status.textContent=text}function updateImportInfo(){if(meta&&data.length){importOk.innerHTML='<div class="ok"><b>✓ Fichier chargé correctement</b><br>'+data.length.toLocaleString("fr-FR")+' lignes importées · '+escapeHtml(meta.file)+' · '+escapeHtml(meta.date)+'</div>'}else importOk.innerHTML='<div class="muted">Aucun fichier chargé.</div>'}function emplacement(p){const e=p["Emplacement"]||"",meuble=p["Meuble"]||"",tiroir=p["Tiroir"]||"",position=p["Position"]||"";const d=[meuble&&"Meuble "+meuble,tiroir&&"Tiroir "+tiroir,position&&"Position "+position].filter(Boolean).join(" · ");return e||(d||"Non renseigné")}function render(){const t=normalize(q.value),m=data.filter(p=>!t||normalize(Object.values(p).join(" ")).includes(t));count.textContent=m.length+" résultat(s) sur "+data.length;results.innerHTML=m.slice(0,150).map(p=>'<div class="result" data-id="'+escapeHtml(p["N° pièce"])+'"><div class="ref">'+escapeHtml(p["Référence"]||p["CodeSAP"]||p["N° pièce"])+"</div><div>"+escapeHtml(p["Désignation"])+"</div><div class="loc">Emplacement : "+escapeHtml(emplacement(p))+"</div><div class="muted">Code SAP : "+escapeHtml(p["CodeSAP"])+" · Stock : "+escapeHtml(p["Stock"])+" · Statut : "+escapeHtml(p["Statut_piece"])+"</div></div>').join("")+(m.length>150?'<div class="card muted">Affinez la recherche pour afficher les résultats suivants.</div>':'');results.querySelectorAll(".result").forEach(el=>el.addEventListener("click",()=>showDetail(data.find(p=>String(p["N° pièce"])===el.dataset.id))))}function showDetail(p){if(!p)return;detail.className="card detail show";detail.innerHTML="<h2>Détail de la pièce</h2>"+FIELDS.map(f=>'<div class="row"><b>'+escapeHtml(f)+"</b><span>"+escapeHtml(p[f]||"")+"</span></div>").join("")+'<button id="closeDetail">Fermer</button>';$("#closeDetail").addEventListener("click",()=>detail.className="card detail");detail.scrollIntoView({behavior:"smooth"})}function parseCSV(text){const rows=[];let row=[],cell="",quoted=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(quoted&&n==='"'){cell+='"';i++}else quoted=!quoted}else if(c===';'&&!quoted){row.push(cell);cell=""}else if((c==="\n"||c==="\r")&&!quoted){if(c==="\r"&&n==="\n")i++;row.push(cell);if(row.some(v=>v.trim()!==""))rows.push(row);row=[];cell=""}else cell+=c}if(cell!==""||row.length){row.push(cell);if(row.some(v=>v.trim()!==""))rows.push(row)}return rows}function importCsvText(text,fileName){const rows=parseCSV(text);if(rows.length<2)throw new Error("Le fichier ne contient aucune ligne de données.");const headers=rows[0].map(h=>h.trim().replace(/^\uFEFF/,"")),missing=REQUIRED.filter(h=>!headers.includes(h));if(missing.length)throw new Error("Colonnes manquantes : "+missing.join(", "));const imported=rows.slice(1).map(row=>{const item={};headers.forEach((h,i)=>item[h]=(row[i]||"").trim());return item}).filter(item=>Object.values(item).some(v=>v!==""));if(!imported.length)throw new Error("Aucune pièce valide détectée.");data=imported;meta={file:fileName,date:new Date().toLocaleString("fr-FR")};localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(KEY+"-meta",JSON.stringify(meta));showMessage("","");updateImportInfo();render()}async function downloadFromGitHub(){try{showMessage("info","Téléchargement de la dernière liste depuis GitHub…");const response=await fetch(GITHUB_CSV_URL+"?t="+Date.now(),{cache:"no-store"});if(!response.ok)throw new Error("Fichier indisponible : HTTP "+response.status);const buffer=await response.arrayBuffer(),text=new TextDecoder("windows-1252").decode(buffer);importCsvText(text,"T_piece_de_rechange.csv — GitHub")}catch(error){console.error(error);showMessage("error","Téléchargement impossible : "+error.message)}}$("#file").addEventListener("change",function(){const file=this.files&&this.files[0];if(!file)return;showMessage("info","Lecture de "+file.name+"…");const reader=new FileReader();reader.onload=()=>{try{importCsvText(reader.result,file.name)}catch(error){console.error(error);showMessage("error","Import impossible : "+error.message)}};reader.onerror=()=>showMessage("error","Erreur de lecture du fichier.");reader.readAsText(file,"windows-1252")});$("#downloadGithub").addEventListener("click",downloadFromGitHub);q.addEventListener("input",render);$("#clear").addEventListener("click",()=>{if(!confirm("Effacer la base locale ?"))return;data=[];meta=null;localStorage.removeItem(KEY);localStorage.removeItem(KEY+"-meta");showMessage("info","Base locale effacée.");updateImportInfo();render()});$("#export").addEventListener("click",()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="pieces-sauvegarde.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)});updateImportInfo();render();
</script></body></html>
